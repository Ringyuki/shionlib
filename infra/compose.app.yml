x-api-service: &api-service
  image: ${API_IMAGE:?API_IMAGE is required}
  restart: unless-stopped
  stop_grace_period: 40s
  volumes:
    - uploads:/var/lib/shionlib/upload
    - scan-logs:/var/lib/shionlib/scan-logs
  networks:
    - shionlib

services:
  migrate:
    image: ${API_IMAGE:?API_IMAGE is required}
    command: ['migrate', 'up']
    restart: 'no'
    environment: *api-environment
    networks:
      - shionlib

  api:
    <<: *api-service
    command: ['serve']
    environment:
      <<: *api-environment
      WORKERS_ENABLED: 'false'
    expose:
      - '5000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'shionlib-api', 'health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *api-service
    command: ['worker']
    environment:
      <<: *api-environment
      APP_NAME: ${WORKER_APP_NAME:-shionlib-worker}
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy

  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:stable}
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
    networks:
      - shionlib
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  uploads:
  scan-logs:
  clamav-db:

networks:
  shionlib:
    driver: bridge
