x-api-service: &api-service
  image: ${API_IMAGE:?API_IMAGE is required}
  restart: unless-stopped
  stop_grace_period: 40s
  volumes:
    - ${UPLOADS_VOLUME:-uploads}:/var/lib/shionlib/upload
    - scan-logs:/var/lib/shionlib/scan-logs
  networks:
    - shionlib

services:
  migrate:
    image: ${API_IMAGE:?API_IMAGE is required}
    command: ['migrate', 'up']
    restart: 'no'
    environment: *api-environment
    networks:
      - shionlib

  api:
    <<: *api-service
    command: ['serve']
    environment:
      <<: *api-environment
      WORKERS_ENABLED: 'false'
    expose:
      - '5000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'shionlib-api', 'health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *api-service
    command: ['worker']
    environment:
      <<: *api-environment
      APP_NAME: ${WORKER_APP_NAME:-shionlib-worker}
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:5000
      CAP_ENDPOINT: ${CAP_ENDPOINT:-}
      HIKARINAGI_SITE_URL: ${HIKARINAGI_SITE_URL:?HIKARINAGI_SITE_URL is required}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:?IMAGE_BASE_URL is required}
      IMAGE_BUCKET_URL: ${IMAGE_BUCKET_URL?IMAGE_BUCKET_URL must be set, empty to show catalog pictures uncut}
      IMAGE_PROCESSOR_URL: ${IMAGE_PROCESSOR_URL?IMAGE_PROCESSOR_URL must be set, empty to show catalog pictures uncut}
    expose:
      - '3000'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - shionlib
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/favicon.ico').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:stable}
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    networks:
      - shionlib
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s

  cap:
    image: ${CAP_IMAGE:-tiago2/cap:3.1.14}
    restart: unless-stopped
    environment:
      ADMIN_KEY: ${CAP_ADMIN_KEY:?CAP_ADMIN_KEY is required}
      REDIS_URL: redis://cap-valkey:6379
      CORS_ORIGIN: ${CAP_CORS_ORIGIN:-}
      RATELIMIT_IP_HEADER: ${CAP_RATELIMIT_IP_HEADER:-}
    expose:
      - '3000'
    depends_on:
      cap-valkey:
        condition: service_healthy
    networks:
      - shionlib
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  cap-valkey:
    image: ${CAP_VALKEY_IMAGE:-valkey/valkey:9-alpine}
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning --maxmemory-policy noeviction
    volumes:
      - cap-data:/data
    networks:
      - shionlib
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  uploads:
  scan-logs:
  clamav-db:
  cap-data:

networks:
  shionlib:
    driver: bridge
