root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/shionlib-serve ./cmd/api"
entrypoint = ["./tmp/shionlib-serve"]
args_bin = ["serve"]
include_dir = ["cmd", "internal", "migrations"]
include_ext = ["go", "json", "sql", "xsl"]
exclude_regex = ["_test\\.go$"]
delay = 300
send_interrupt = true
kill_delay = "10s"
stop_on_error = true

[log]
main_only = true

[misc]
clean_on_exit = true
