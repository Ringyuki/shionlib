root = "."
tmp_dir = "tmp"

[build]
cmd = "./scripts/dev-build.sh"
entrypoint = ["./scripts/dev-run.sh"]
include_dir = ["cmd", "internal", "migrations"]
include_ext = ["go", "json", "sql", "xsl"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = true
delay = 1000
send_interrupt = true
kill_delay = "10s"
stop_on_error = true

[log]
main_only = true

[misc]
clean_on_exit = false
