name: deploy og

on:
  workflow_run:
    workflows: ['ci']
    types: [completed]
    branches: ['main']
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Deploy target environment'
        type: choice
        options:
          - staging
          - production
        default: staging
        required: true
      release_ref:
        description: 'Git ref to deploy (branch, tag, or SHA). Leave empty to use current SHA.'
        type: string
        required: false

run-name: og deploy to ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'staging' }}

permissions:
  contents: read
  actions: read

concurrency:
  group: shionlib-og-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'staging' }}
  cancel-in-progress: true

jobs:
  guard:
    name: Deploy Guard
    runs-on: ubuntu-latest
    if: github.repository == 'Ringyuki/shionlib'
    outputs:
      should-deploy: ${{ steps.dispatch.outputs.should-deploy || steps.ci-check.outputs.should-deploy }}
      deploy-sha: ${{ steps.dispatch.outputs.deploy-sha || steps.ci-check.outputs.deploy-sha }}
    steps:
      - name: Validate dispatch inputs
        if: github.event_name == 'workflow_dispatch' && inputs.target_environment == 'production' && inputs.release_ref == ''
        run: |
          echo "release_ref is required when deploying production"
          exit 1

      - name: Set dispatch deploy
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "should-deploy=true" >> "$GITHUB_OUTPUT"
          echo "deploy-sha=${{ inputs.release_ref || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Check CI result and paths
        id: ci-check
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run
            if (run.conclusion !== 'success') {
              core.setFailed(`CI conclusion: ${run.conclusion}, aborting deploy`)
              return
            }

            const sha = run.head_sha
            core.setOutput('deploy-sha', sha)

            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            })

            const files = commit.files || []
            if (files.length === 0) {
              core.info('No file list available, deploying to be safe')
              core.setOutput('should-deploy', 'true')
              return
            }

            const relevantPaths = [
              'apps/og/',
              'package.json',
              'pnpm-lock.yaml',
              'pnpm-workspace.yaml',
              '.npmrc',
            ]
            const changed = files.some(f =>
              relevantPaths.some(p => f.filename === p || f.filename.startsWith(p))
            )
            core.setOutput('should-deploy', changed ? 'true' : 'false')
            if (!changed) core.info('No relevant path changes, skipping deploy')

  build-and-deploy:
    name: Build and Deploy OG
    needs: guard
    if: needs.guard.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'production') && 'production-og' || 'staging-og' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.deploy-sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Type check OG
        run: pnpm --filter shionlib-og typecheck

      - name: Archive artifact
        working-directory: apps/og
        run: |
          DEPLOY_SHA=$(git rev-parse --short=7 HEAD)
          TAR_NAME="og-release-${DEPLOY_SHA}.tgz"
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "TAR_NAME=$TAR_NAME" >> "$GITHUB_ENV"
          tar -czf "$TAR_NAME" \
            src \
            assets \
            package.json \
            tsconfig.json \
            ecosystem.config.cjs

      - name: Install cloudflared
        run: |
          set -e
          mkdir -p /tmp/cloudflared
          curl -sL -o /tmp/cloudflared/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared/cloudflared
          /tmp/cloudflared/cloudflared --version

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Upload to server
        env:
          SSH_PROXY_COMMAND: '/tmp/cloudflared/cloudflared access ssh --id ${{ secrets.SSH_CLOUDFLARED_ID }} --secret ${{ secrets.SSH_CLOUDFLARED_SECRET }} --hostname %h'
        run: |
          scp \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="$SSH_PROXY_COMMAND" \
            -P "${{ secrets.SSH_PORT }}" \
            "apps/og/${TAR_NAME}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/${TAR_NAME}"

      - name: Deploy on server
        env:
          SSH_PROXY_COMMAND: '/tmp/cloudflared/cloudflared access ssh --id ${{ secrets.SSH_CLOUDFLARED_ID }} --secret ${{ secrets.SSH_CLOUDFLARED_SECRET }} --hostname %h'
          PM2_ENV: ${{ vars.PM2_ENV }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="$SSH_PROXY_COMMAND" \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DEPLOY_DIR='${{ secrets.DEPLOY_DIR }}' DEPLOY_SHA='${DEPLOY_SHA}' PM2_ENV='${PM2_ENV}' bash -s" << 'EOF_REMOTE'
          [ -f ~/.bashrc ] && . ~/.bashrc
          [ -f ~/.profile ] && . ~/.profile
          set -euo pipefail

          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
            nvm use 24 >/dev/null || true
          fi
          KEEP_RELEASES=5
          PM2_ENV="${PM2_ENV:-production}"

          if ! command -v node >/dev/null 2>&1; then
            echo "node is not available in PATH"
            exit 1
          fi
          if ! command -v bun >/dev/null 2>&1; then
            echo "bun is not available in PATH"
            exit 1
          fi
          if ! command -v pm2 >/dev/null 2>&1; then
            echo "pm2 is not available in PATH"
            exit 1
          fi
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm is not available in PATH"
            exit 1
          fi

          mkdir -p "$DEPLOY_DIR/releases"

          TS_UTC=$(date -u +%Y%m%d%H%M%S)
          RELEASE_NAME="${TS_UTC}-${DEPLOY_SHA}"
          RELEASE_DIR="$DEPLOY_DIR/releases/$RELEASE_NAME"
          SHARED_DIR="$DEPLOY_DIR/shared"

          TAR_NAME="og-release-${DEPLOY_SHA}.tgz"
          mkdir -p "$RELEASE_DIR"
          tar -xzf "/tmp/${TAR_NAME}" -C "$RELEASE_DIR"
          rm -f "/tmp/${TAR_NAME}"

          if [ ! -f "$SHARED_DIR/.env" ]; then
            echo "missing shared env file: $SHARED_DIR/.env"
            exit 1
          fi
          if [ ! -f "$RELEASE_DIR/ecosystem.config.cjs" ]; then
            if [ -f "$SHARED_DIR/ecosystem.config.cjs" ]; then
              ln -sfn "$SHARED_DIR/ecosystem.config.cjs" "$RELEASE_DIR/ecosystem.config.cjs"
            else
              echo "missing pm2 ecosystem file in release and shared paths"
              exit 1
            fi
          fi

          ln -sfn "$SHARED_DIR/.env" "$RELEASE_DIR/.env"

          cd "$RELEASE_DIR"
          pnpm install --prod --no-frozen-lockfile

          ln -sfn "$RELEASE_DIR" "$DEPLOY_DIR/current"

          cd "$DEPLOY_DIR/current"
          set -a
          . "$RELEASE_DIR/.env"
          set +a
          pm2 delete shionlib-og 2>/dev/null || true
          pm2 start ecosystem.config.cjs --only shionlib-og --env "$PM2_ENV" --update-env
          pm2 save

          cd "$DEPLOY_DIR/releases"
          ls -1dt */ | tail -n +$((KEEP_RELEASES+1)) | xargs -r rm -rf
          EOF_REMOTE

      - name: Health check
        env:
          SSH_PROXY_COMMAND: '/tmp/cloudflared/cloudflared access ssh --id ${{ secrets.SSH_CLOUDFLARED_ID }} --secret ${{ secrets.SSH_CLOUDFLARED_SECRET }} --hostname %h'
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          if [ -z "${HEALTHCHECK_URL:-}" ]; then
            echo "HEALTHCHECK_URL is not set"
            exit 1
          fi

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="$SSH_PROXY_COMMAND" \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "HEALTHCHECK_URL='${HEALTHCHECK_URL}' bash -s" << 'EOF_REMOTE'
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 8 "$HEALTHCHECK_URL" >/dev/null; then
              echo "health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "health check failed: $HEALTHCHECK_URL"
          curl -iS --max-time 8 "$HEALTHCHECK_URL" || true
          exit 1
          EOF_REMOTE
