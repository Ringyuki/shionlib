name: production

on:
  push:
    branches: ['main']
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'infra/**'
      - '.github/workflows/production.yml'
      - '!**/*.md'
  workflow_dispatch:

run-name: production ${{ github.sha }}

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  images:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and tag
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shionlib-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=shionlib-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=shionlib-${{ matrix.app }}

  deploy:
    name: Deploy through Dokploy
    runs-on: ubuntu-latest
    needs: images
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: infra/scripts/dokploy-deploy.sh
