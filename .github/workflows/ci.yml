name: ci

on:
  pull_request:
    branches: ['main']
    paths:
      - 'apps/og/**'
      - 'apps/download-worker/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.prettierignore'
      - '.prettierrc'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-og.yml'
      - '.github/workflows/deploy-download-worker.yml'
      - '.github/workflows/promote-og-production.yml'
  push:
    branches: ['main']
    paths:
      - 'apps/og/**'
      - 'apps/download-worker/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.prettierignore'
      - '.prettierrc'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-og.yml'
      - '.github/workflows/deploy-download-worker.yml'
      - '.github/workflows/promote-og-production.yml'
  workflow_dispatch:

concurrency:
  group: shionlib-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  og-checks:
    name: OG Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter shionlib-og typecheck

      - name: Unit tests
        run: pnpm --filter shionlib-og test

  download-worker-checks:
    name: Download Worker Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter shionlib-download-worker typecheck

      - name: Unit tests
        run: pnpm --filter shionlib-download-worker test
