name: deploy download worker

on:
  push:
    branches: ['main']
    paths:
      - 'apps/download-worker/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-download-worker.yml'
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Git ref to deploy (branch, tag, or SHA). Leave empty to use current SHA.'
        type: string
        required: false

run-name: download-worker deploy

permissions:
  contents: read
  actions: read

concurrency:
  group: shionlib-download-worker-deploy
  cancel-in-progress: true

jobs:
  wait-for-ci:
    name: Wait For CI
    runs-on: ubuntu-latest
    if: github.repository == 'Ringyuki/shionlib' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Wait for CI workflow success
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const sha = context.sha
            const maxAttempts = 40
            const delayMs = 15000

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const resp = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'ci.yml',
                event: 'push',
                head_sha: sha,
                per_page: 10,
              })

              const run = resp.data.workflow_runs[0]
              if (!run) {
                core.info(`Attempt ${attempt}/${maxAttempts}: CI run not found for ${sha}, waiting...`)
              } else if (run.status !== 'completed') {
                core.info(`Attempt ${attempt}/${maxAttempts}: CI status=${run.status}, waiting... ${run.html_url}`)
              } else if (run.conclusion === 'success') {
                core.info(`CI succeeded: ${run.html_url}`)
                return
              } else {
                core.setFailed(`CI conclusion=${run.conclusion}. ${run.html_url}`)
                return
              }

              await new Promise(resolve => setTimeout(resolve, delayMs))
            }

            core.setFailed(`Timed out waiting for CI success for ${sha}`)

  deploy:
    name: Deploy Download Worker
    needs: wait-for-ci
    runs-on: ubuntu-latest
    if: github.repository == 'Ringyuki/shionlib' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    environment: production-download-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter shionlib-download-worker typecheck

      - name: Deploy to Cloudflare
        working-directory: apps/download-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
