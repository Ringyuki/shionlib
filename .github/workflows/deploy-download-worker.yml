name: deploy download worker

on:
  workflow_run:
    workflows: ['ci']
    types: [completed]
    branches: ['main']
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Git ref to deploy (branch, tag, or SHA). Leave empty to use current SHA.'
        type: string
        required: false

run-name: download-worker deploy

permissions:
  contents: read
  actions: read

concurrency:
  group: shionlib-download-worker-deploy
  cancel-in-progress: true

jobs:
  guard:
    name: Deploy Guard
    runs-on: ubuntu-latest
    if: github.repository == 'Ringyuki/shionlib'
    outputs:
      should-deploy: ${{ steps.dispatch.outputs.should-deploy || steps.ci-check.outputs.should-deploy }}
      deploy-sha: ${{ steps.dispatch.outputs.deploy-sha || steps.ci-check.outputs.deploy-sha }}
    steps:
      - name: Set dispatch deploy
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "should-deploy=true" >> "$GITHUB_OUTPUT"
          echo "deploy-sha=${{ inputs.release_ref || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Check CI result and paths
        id: ci-check
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run
            if (run.conclusion !== 'success') {
              core.setFailed(`CI conclusion: ${run.conclusion}, aborting deploy`)
              return
            }

            const sha = run.head_sha
            core.setOutput('deploy-sha', sha)

            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            })

            const files = commit.files || []
            if (files.length === 0) {
              core.info('No file list available, deploying to be safe')
              core.setOutput('should-deploy', 'true')
              return
            }

            const relevantPaths = [
              'apps/download-worker/',
              'package.json',
              'pnpm-lock.yaml',
              'pnpm-workspace.yaml',
            ]
            const changed = files.some(f =>
              relevantPaths.some(p => f.filename === p || f.filename.startsWith(p))
            )
            core.setOutput('should-deploy', changed ? 'true' : 'false')
            if (!changed) core.info('No relevant path changes, skipping deploy')

  deploy:
    name: Deploy Download Worker
    needs: guard
    if: needs.guard.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    environment: production-download-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.deploy-sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter shionlib-download-worker typecheck

      - name: Deploy to Cloudflare
        working-directory: apps/download-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
