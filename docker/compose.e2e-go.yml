name: shionlib-e2e-go

x-api-env-file: &api-env-file
  - ./env/api-e2e.env

x-api-database: &api-database
  DATABASE_URL: postgres://${POSTGRES_USER:-shionlib}:${POSTGRES_PASSWORD:-shionlib}@postgres:5432/${POSTGRES_DB:-shionlib}?sslmode=disable
  SITE_URL: http://localhost:${FRONTEND_PORT:-3200}
  CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-3200}
  WEBAUTHN_ORIGINS: http://localhost:${FRONTEND_PORT:-3200}
  OIDC_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3200}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shionlib}
      POSTGRES_USER: ${POSTGRES_USER:-shionlib}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shionlib}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-shionlib} -d ${POSTGRES_DB:-shionlib}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  clamav:
    build:
      context: ..
      dockerfile: docker/clamav/Dockerfile
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', "printf 'PING\\n' | nc -w 2 127.0.0.1 3310 | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  migrate:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: shionlib-e2e-go-api:local
    command: ['migrate', 'up']
    restart: 'no'
    env_file: *api-env-file
    environment: *api-database
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: ../apps/api
      dockerfile: ../../docker/api-e2e/Dockerfile
    image: shionlib-e2e-go-seed:local
    command: ['e2e', 'prepare']
    restart: 'no'
    env_file: *api-env-file
    environment: *api-database
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  api:
    image: shionlib-e2e-go-api:local
    command: ['serve']
    restart: unless-stopped
    env_file: *api-env-file
    environment: *api-database
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    ports:
      - '${BACKEND_PORT:-5201}:5000'
    volumes:
      - uploads-data:/var/lib/shionlib/upload
      - scan-logs:/var/lib/shionlib/scan-logs
    healthcheck:
      test: ['CMD', 'shionlib-api', 'health']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  og:
    build:
      context: ..
      dockerfile: apps/og/Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/og.env
    environment:
      BACKEND_INTERNAL_URL: http://api:5000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${OG_PORT:-4200}:4000'
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
      args:
        INTERNAL_API_BASE_URL: http://api:5000
        NEXT_PUBLIC_PROD_API_PATH: /api
        NEXT_PUBLIC_SITE_URL: http://localhost:${FRONTEND_PORT:-3200}
        NEXT_PUBLIC_SOCKETIO_URL: http://localhost:${BACKEND_PORT:-5201}
        NEXT_PUBLIC_SHIONLIB_IMAGE_BED_HOST: images.yurari.moe
        NEXT_PUBLIC_SHIONLIB_IMAGE_BED_URL: https://images.yurari.moe
        NEXT_PUBLIC_OG_SERVICE_URL: http://localhost:${OG_PORT:-4200}
    image: shionlib-e2e-go-frontend:local
    restart: unless-stopped
    env_file:
      - ./env/frontend.env
    environment:
      INTERNAL_API_BASE_URL: http://api:5000
      NEXT_PUBLIC_SITE_URL: http://localhost:${FRONTEND_PORT:-3200}
      NEXT_PUBLIC_SOCKETIO_URL: http://localhost:${BACKEND_PORT:-5201}
      NEXT_PUBLIC_OG_SERVICE_URL: http://og:4000
    depends_on:
      api:
        condition: service_healthy
      og:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-3200}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  clamav-db:
  uploads-data:
  scan-logs:
